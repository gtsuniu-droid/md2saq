[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Firebase's sign-in handler, served from this domain so the Google window names this site.
[[redirects]]
  from = "/__/auth/*"
  to = "https://saqmd2.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
